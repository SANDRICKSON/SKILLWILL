{% extends 'posts/base.html' %}

{% block content %}
<div class="container mt-5 fade-in">
    <div class="delete-card">
        <h2>⚠️ Are you sure you want to delete this post?</h2>
        <p><strong>{{ post.title }}</strong></p>

        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">🗑️ Yes, Delete</button>
            <a href="{% url 'post_detail' post.pk %}" class="btn btn-secondary">↩️ Cancel</a>
        </form>
    </div>
</div>

<style>
.delete-card {
    background: white;
    padding: 40px;
    border-radius: 16px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.1);
    text-align: center;
}

.delete-card h2 {
    color: #e74c3c;
    margin-bottom: 20px;
}

.btn {
    padding: 10px 20px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 600;
    margin: 0 10px;
    display: inline-block;
}

.btn-danger {
    background-color: #e74c3c;
    color: white;
    border: none;
}

.btn-danger:hover {
    background-color: #c0392b;
}

.btn-secondary {
    background-color: #bdc3c7;
    color: #2c3e50;
    text-decoration: none;
}

.btn-secondary:hover {
    background-color: #95a5a6;
}
</style>
{% endblock %}
