{% extends 'posts/base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="card shadow p-4">
        <h2 class="mb-4">New / Edit Post</h2>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit" class="btn btn-success mt-3">💾 Save</button>
        </form>
    </div>
</div>
<style>
    form {
    font-size: 16px;
}

form p {
    margin-bottom: 16px;
}

form input[type="text"],
form textarea,
form input[type="file"] {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-family: inherit;
    font-size: 15px;
    transition: border-color 0.3s ease;
}

form input:focus,
form textarea:focus {
    border-color: #3498db;
    outline: none;
    box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.15);
}

button[type="submit"] {
    padding: 10px 20px;
    font-weight: bold;
    font-size: 15px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
}

</style>
{% endblock %}
