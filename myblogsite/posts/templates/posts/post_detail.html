{% extends 'posts/base.html' %}

{% block content %}
<div class="container mt-5 fade-in">
    <div class="post-card glass-effect">
        <h2 class="post-title">{{ post.title }}</h2>
        <p class="post-content">{{ post.content }}</p>

        {% if post.image %}
        <div class="post-image-container">
            <img src="{{ post.image.url }}" alt="Post Image">
        </div>
        {% endif %}

        <div class="post-meta">
            <p class="author-text">
                By:
                {% if post.author %}
                    <a href="{% url 'profile' post.author.username %}">{{ post.post_author }}</a>
                {% else %}
                    {{ post.post_author }}
                {% endif %}
            </p>
        </div>

        <div class="button-group">
            <a href="{% url 'post_update' post.pk %}" class="btn edit-btn">✏️ Edit</a>
            <a href="{% url 'post_delete' post.pk %}" class="btn delete-btn">🗑️ Delete</a>
        </div>
    </div>
</div>

<style>
body {
    font-family: 'Nunito', sans-serif;
    background: linear-gradient(135deg, #e0ecf8, #f6f9fc);
    margin: 0;
    padding: 0;
    color: #2c3e50;
}

.container {
    max-width: 960px;
    margin: 60px auto;
    padding: 20px;
}

.fade-in {
    animation: fadeIn 0.7s ease-in-out;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

.post-card {
    background-color: #ffffffcc;
    border-radius: 20px;
    padding: 40px;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.1);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    backdrop-filter: blur(10px);
}

.post-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.12);
}

.post-title {
    font-size: 36px;
    font-weight: 800;
    color: #34495e;
    margin-bottom: 20px;
    border-left: 6px solid #3498db;
    padding-left: 12px;
}

.post-content {
    font-size: 18px;
    line-height: 1.8;
    margin-bottom: 30px;
}

.post-image-container {
    text-align: center;
    margin: 30px 0;
}

.post-image-container img {
    max-width: 100%;
    border-radius: 16px;
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.12);
    transition: transform 0.3s;
}

.post-image-container img:hover {
    transform: scale(1.04);
}

.post-meta {
    font-size: 15px;
    color: #7f8c8d;
    margin-bottom: 30px;
    font-style: italic;
}

.post-meta a {
    color: #2980b9;
    font-weight: 600;
    text-decoration: none;
    border-bottom: 1px dashed #2980b9;
}

.post-meta a:hover {
    color: #1abc9c;
    border-bottom-style: solid;
}

.button-group {
    display: flex;
    gap: 15px;
}

.btn {
    padding: 10px 20px;
    font-size: 15px;
    border-radius: 10px;
    font-weight: 600;
    text-decoration: none;
    transition: all 0.3s ease;
    cursor: pointer;
}

.edit-btn {
    color: #3498db;
    border: 2px solid #3498db;
    background-color: transparent;
}

.edit-btn:hover {
    background-color: #3498db;
    color: white;
}

.delete-btn {
    color: #e74c3c;
    border: 2px solid #e74c3c;
    background-color: transparent;
}

.delete-btn:hover {
    background-color: #e74c3c;
    color: white;
}
</style>
{% endblock %}
