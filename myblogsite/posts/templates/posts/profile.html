{% extends 'posts/base.html' %}

{% block content %}
<div class="container mt-5 fade-in">
    <h2 class="page-title">👤 {{ username }}'s Profile</h2>

    {% if posts %}
    <ul class="post-list">
        {% for post in posts %}
        <li class="post-item">
            <a href="{% url 'post_detail' post.pk %}" class="post-link">{{ post.title }}</a>

            {% if post.image %}
            <div class="post-image" style="margin-top: 20px;">
                <img src="{{ post.image.url }}" alt="Post Image" class="img-fluid" style="max-width: 100%; height: auto;">
            </div>
            {% endif %}
        </li>
        {% endfor %}
    </ul>
    {% else %}
    <p class="no-posts">📭 No posts found for {{ username }}.</p>
    {% endif %}
</div>
{% endblock %}
